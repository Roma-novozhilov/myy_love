<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<title>Моя звёздочка</title>
<style>
  :root { --bg:#070a1c; --pink:#ff8fb8; --gold:#ffd98a; --ink:#fff4f8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #hud { position:fixed; top:max(14px,env(safe-area-inset-top)); left:0; right:0; text-align:center;
    pointer-events:none; transition:opacity 1s; }
  #hud .city { font-size:13px; letter-spacing:.25em; text-transform:uppercase; opacity:.7; }
  #hud .clock { font-size:clamp(40px,11vw,76px); font-weight:200; letter-spacing:.04em;
    text-shadow:0 0 24px rgba(255,150,200,.6); font-variant-numeric:tabular-nums; }
  #hud .date { font-size:clamp(15px,4vw,22px); opacity:.85; margin-top:-4px; }
  #hud.hide { opacity:0; }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; transition:opacity 1.2s; }
  .overlay.off { opacity:0; pointer-events:none; }

  #intro { background:radial-gradient(ellipse at center, rgba(7,10,28,.55), rgba(7,10,28,.9)); }
  #intro h1 { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:400;
    font-size:clamp(30px,8vw,56px); margin:0 0 10px; color:var(--gold); text-shadow:0 0 30px rgba(255,200,120,.5); }
  #intro p { max-width:30em; opacity:.85; line-height:1.5; margin:6px 0; }
  #count { font-size:clamp(28px,8vw,44px); font-weight:200; margin:14px 0 20px; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:var(--ink); background:linear-gradient(135deg,#ff6fa5,#ffb36b); border:0;
    padding:14px 28px; border-radius:999px; font-size:16px; box-shadow:0 6px 30px rgba(255,110,170,.45); cursor:pointer; }
  button.ghost { background:rgba(255,255,255,.12); box-shadow:none; padding:10px 20px; font-size:14px; }

  #finale { background:rgba(7,10,28,.0); justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(40px,env(safe-area-inset-bottom)); }
  #finale.bg { background:rgba(7,10,28,.62); transition:background 2s, opacity 1.2s; }
  #finale .inner { margin:auto; width:100%; max-width:640px; }
  #finale h2 { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:400;
    font-size:clamp(32px,9vw,60px); line-height:1.15; margin:0 0 18px; color:var(--gold);
    text-shadow:0 0 36px rgba(255,190,110,.65); }
  #finale .line { font-size:clamp(16px,4.3vw,21px); line-height:1.55; margin:0 0 14px; opacity:0;
    transform:translateY(10px); transition:opacity 1.6s, transform 1.6s; }
  #finale .line.show { opacity:.95; transform:none; }
  #finale .sign { color:var(--pink); font-size:clamp(20px,5.5vw,28px); }

  #photos { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:10px 6px 22px;
    margin:0 -6px 8px; opacity:0; transition:opacity 1.6s; }
  #photos.show { opacity:1; }
  #photos figure { flex:0 0 min(70vw,260px); margin:0; scroll-snap-align:center; background:#fff8f2; padding:10px 10px 30px;
    border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,.5); transform:rotate(var(--r,0deg)); }
  #photos img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#222; }
  #photos { scrollbar-width:none; -ms-overflow-style:none; }
  #photos::-webkit-scrollbar { display:none; }
  #photos:empty { display:none; }
  #hint { margin:-6px 0 18px; font-size:15px; letter-spacing:.08em; color:var(--gold); opacity:0; transition:opacity 1.6s 1s; }
  #photos.show + #hint { opacity:.85; animation:nudge 1.8s ease-in-out infinite; }
  #photos:empty + #hint { display:none; }
  @keyframes nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(8px); } }
  #replay { margin-top:18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="city" id="hudCity"></div>
  <div class="clock" id="hudClock">00:00</div>
  <div class="date" id="hudDate"></div>
</div>

<div id="intro" class="overlay">
  <h1 id="introTitle">Для тебя</h1>
  <p>Полночь 16 октября идёт по планете с востока на запад — страна за страной, город за городом.<br>
     И каждый её шаг приближает её к тебе.</p>
  <div id="count">--:--:--</div>
  <button id="startBtn">Запустить сейчас</button>
  <p style="font-size:13px;opacity:.55;margin-top:18px">Оставь страницу открытой — всё начнётся само за минуту до полуночи.<br>Звук можно не включать, но лучше с наушниками 🎧</p>
</div>

<div id="finale" class="overlay off">
  <div class="inner">
    <h2 id="finTitle"></h2>
    <div id="photos"></div>
    <div id="hint">Листай) →</div>
    <div id="lines"></div>
    <button class="ghost" id="replay">↻ посмотреть заново</button>
  </div>
</div>

<script src="d3.js"></script>
<script src="topo.js"></script>
<script src="world.js"></script>
<script>
/* =================== НАСТРОЙКИ (меняй здесь) =================== */
const CONFIG = {
  name: "Самирушка",                        // имя именинницы (можно и через ссылку: ?name=Катя)
  home: { name: "Москва", lon: 37.62, lat: 55.75, utc: 3 },   // где она живёт; utc — часовой пояс
  target: new Date(2026, 9, 16, 0, 0, 0),  // момент полуночи по времени устройства (16 октября 00:00)
  d1: 60,                                  // секунд пути полуночи от Новой Зеландии до неё
  d2: 18,                                  // секунд, пока дальше накрывается остальной мир
  title: "С днём рождения, {name}!",
  lines: [
    "Пока ты читаешь это, мир уже встретил 16 октября — город за городом, страна за страной.",
    "Но по-настоящему этот день начался для меня только тогда, когда дошёл до тебя.",
    "Ты — моя звёздочка. Ты светишь так, что даже самый тёмный день рядом с тобой становится тёплым.",
    "Я хочу, чтобы в этом году сбывались даже те мечты, о которых ты боишься говорить вслух, чтобы тебя окружали только те, кто любит тебя так же сильно, как я, и чтобы ты всегда чувствовала — ты настоящее чудо.",
    "Спасибо, что ты есть. Спасибо за каждый наш день.",
    "<span class='sign'>С днём рождения, моя звёздочка ✨<br>Я люблю тебя.</span>"
  ]
};
/* Фото: положи файлы в папку photos и назови 1.jpg, 2.jpg, 3.jpg ... (до 12 штук; подойдут jpg/jpeg/png/webp) */

const CITIES = [
  ["Окленд",174.76,-36.85],["Сува",178.4,-18.1],["Сидней",151.2,-33.9],["Владивосток",131.9,43.1],
  ["Токио",139.7,35.7],["Сеул",127,37.6],["Пекин",116.4,39.9],["Сингапур",103.8,1.35],
  ["Бангкок",100.5,13.75],["Новосибирск",82.9,55],["Дели",77.2,28.6],["Екатеринбург",60.6,56.8],
  ["Дубай",55.3,25.2],["Москва",37.6,55.75],["Стамбул",29,41],["Киев",30.5,50.45],["Каир",31.2,30],
  ["Кейптаун",18.4,-33.9],["Берлин",13.4,52.5],["Рим",12.5,41.9],["Париж",2.35,48.85],
  ["Лондон",-0.13,51.5],["Лагос",3.4,6.5],["Рейкьявик",-21.9,64.1],["Рио-де-Жанейро",-43.2,-22.9],
  ["Буэнос-Айрес",-58.4,-34.6],["Нью-Йорк",-74,40.7],["Чикаго",-87.6,41.9],["Мехико",-99.1,19.4],
  ["Лос-Анджелес",-118.2,34],["Анкоридж",-149.9,61.2],["Гонолулу",-157.9,21.3]
].map(([name,lon,lat]) => ({name,lon,lat,litAt:null}));

/* =================== ДАЛЬШЕ ЛУЧШЕ НЕ ТРОГАТЬ =================== */
const q = new URLSearchParams(location.search);
if (q.get("name")) CONFIG.name = q.get("name");
const H = CONFIG.home, SHOME = 14 - H.utc;        // «часов с момента, когда полночь пришла в UTC+14»
const MONTH = "октября";

const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
let W, H_, DPR, proj, pathG, land, borders, graticule, stars = [];

const world = window.WORLD;
land = topojson.feature(world, world.objects.land);
borders = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);
graticule = d3.geoGraticule10();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H_ = innerHeight;
  cv.width = W * DPR; cv.height = H_ * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const padTop = W < H_ ? H_ * 0.22 : 90, pad = 10;
  proj = d3.geoNaturalEarth1().fitExtent([[pad,padTop],[W-pad,H_-pad]], {type:"Sphere"});
  pathG = d3.geoPath(proj, ctx);
  stars = Array.from({length: 140}, () => ({x:Math.random()*W, y:Math.random()*H_, r:Math.random()*1.3+.2, p:Math.random()*6}));
}
addEventListener("resize", resize); resize();

/* ---------- состояние ---------- */
let state = "intro", t0 = 0, burstsDone = 0, lastBurst = 0, finaleShown = false, linesTimer = [];
const parts = [];

function frontAt(e) {
  if (e < CONFIG.d1) {
    const p = e / CONFIG.d1, s = SHOME * (1 - Math.pow(1 - p, 2));   // замедляется к концу
    return { lon: H.lon + 15 * (SHOME - s), s };
  }
  const k = Math.min((e - CONFIG.d1) / CONFIG.d2, 1), ease = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
  return { lon: H.lon - (H.lon + 180) * ease, s: SHOME };
}

function start(syncT0) {
  state = "run"; t0 = syncT0 || performance.now(); burstsDone = 0; finaleShown = false;
  CITIES.forEach(c => c.litAt = null); parts.length = 0;
  linesTimer.forEach(clearTimeout); linesTimer = [];
  $("intro").classList.add("off"); $("hud").classList.remove("hide");
  $("finale").classList.add("off"); $("finale").classList.remove("bg");
  document.querySelectorAll("#lines .line").forEach(l => l.classList.remove("show"));
  $("photos").classList.remove("show");
  $("hudCity").textContent = H.name;
}
$("startBtn").onclick = () => start();
$("replay").onclick = () => { $("finale").scrollTop = 0; start(); };

/* ---------- фейерверк ---------- */
function burst(x, y, n = 60) {
  const hue = [330, 345, 40, 50, 300][Math.floor(Math.random()*5)];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 40 + Math.random() * 200;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, dec:.35+Math.random()*.5, c:`hsl(${hue+Math.random()*30-15},100%,${65+Math.random()*20}%)`});
  }
}
function updateParts(dt) {
  for (let i = parts.length-1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 90*dt; p.vx *= .985; p.life -= p.dec*dt;
    if (p.life <= 0) parts.splice(i,1);
  }
}

/* ---------- рисование ---------- */
function star(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r*.42 : r, a = rot + i*Math.PI/5 - Math.PI/2;
    ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a)*rr, y + Math.sin(a)*rr);
  }
  ctx.closePath();
}
function maskPoly(lon) {
  const pts = [];
  for (let lat = 90; lat >= -90; lat -= 4) pts.push(proj([lon, lat]));
  for (let lat = -90; lat <= 90; lat += 4) pts.push(proj([179.999, lat]));
  ctx.beginPath(); pts.forEach((p,i) => ctx[i ? "lineTo" : "moveTo"](p[0], p[1])); ctx.closePath();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last)/1000, .05); last = now;
  const tt = now/1000;

  // авто-старт: за d1 секунд до полуночи
  if (state === "intro") {
    const left = CONFIG.target - Date.now();
    if (left <= CONFIG.d1*1000 && left > -(CONFIG.d1+CONFIG.d2)*1000) {
      start(now - (CONFIG.d1*1000 - left));
    } else {
      const s = Math.max(0, Math.round(left/1000));
      $("count").textContent = left > 0
        ? [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(v => String(v).padStart(2,"0")).join(":")
        : "ты уже родилась 🎂";
    }
  }

  // фон
  const g = ctx.createRadialGradient(W/2, H_/2, 0, W/2, H_/2, Math.max(W,H_)*.7);
  g.addColorStop(0, "#141a45"); g.addColorStop(1, "#050716");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H_);
  for (const s of stars) { ctx.globalAlpha = .25 + .5*Math.abs(Math.sin(tt*.8 + s.p)); ctx.fillStyle = "#fff"; ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1;

  const e = state === "run" ? (now - t0)/1000 : -1;
  const fr = e >= 0 ? frontAt(e) : { lon: 999, s: 0 };
  const front = fr.lon;

  // сфера, сетка, суша
  ctx.beginPath(); pathG({type:"Sphere"}); ctx.fillStyle = "rgba(20,28,70,.55)"; ctx.fill();
  ctx.beginPath(); pathG(graticule); ctx.strokeStyle = "rgba(140,160,255,.07)"; ctx.lineWidth = .6; ctx.stroke();
  ctx.beginPath(); pathG(land); ctx.fillStyle = "#222a5e"; ctx.fill();
  ctx.beginPath(); pathG(borders); ctx.strokeStyle = "rgba(10,14,40,.7)"; ctx.lineWidth = .5; ctx.stroke();

  // накрытая аурой часть
  if (front < 180) {
    const fl = Math.max(front, -180);
    ctx.save();
    maskPoly(fl); ctx.clip();
    ctx.beginPath(); pathG(land);
    ctx.fillStyle = "#e0558f"; ctx.fill();
    ctx.beginPath(); pathG(borders); ctx.strokeStyle = "rgba(255,240,190,.55)"; ctx.lineWidth = .6; ctx.stroke();
    const fx = proj([fl, 0])[0];
    const lg = ctx.createLinearGradient(fx, 0, fx + W*.22, 0);
    lg.addColorStop(0, "rgba(255,190,90,.38)"); lg.addColorStop(1, "rgba(255,190,90,0)");
    ctx.beginPath(); pathG(land); ctx.clip();
    ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = lg; ctx.fillRect(0,0,W,H_);
    ctx.restore();
    // светящаяся линия полуночи
    ctx.save();
    ctx.beginPath(); for (let lat = 90; lat >= -90; lat -= 3) { const p = proj([fl,lat]); ctx[lat===90?"moveTo":"lineTo"](p[0],p[1]); }
    ctx.strokeStyle = "rgba(255,225,150,.95)"; ctx.lineWidth = 2; ctx.shadowColor = "#ffd98a"; ctx.shadowBlur = 24; ctx.stroke();
    ctx.restore();
  }

  // города
  ctx.font = (W < 500 ? 11 : 13) + "px system-ui,sans-serif";
  for (const c of CITIES) {
    const p = proj([c.lon, c.lat]);
    if (c.litAt === null && c.lon >= front && e >= 0) c.litAt = tt;
    if (c.litAt !== null) {
      const age = tt - c.litAt;
      ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, 7); ctx.fillStyle = "#fffbe8"; ctx.fill();
      if (age < 1.8) {
        ctx.beginPath(); ctx.arc(p[0], p[1], 3 + age*22, 0, 7);
        ctx.strokeStyle = `rgba(255,240,180,${1 - age/1.8})`; ctx.lineWidth = 1.5; ctx.stroke();
      }
      const la = Math.min(1, age*3) * (age < 3.5 ? 1 : Math.max(0, 1 - (age-3.5)));
      if (la > 0) {
        ctx.globalAlpha = la; ctx.fillStyle = "#fff"; ctx.shadowColor = "#000"; ctx.shadowBlur = 4;
        ctx.textAlign = p[0] > W*.8 ? "right" : "left";
        ctx.fillText(c.name + " · 00:00", p[0] + (p[0] > W*.8 ? -8 : 8), p[1] - 8);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
    }
  }

  // её звезда
  const hp = proj([H.lon, H.lat]);
  const reached = e >= CONFIG.d1;
  const pulse = 1 + .15*Math.sin(tt*3);
  const R = (reached ? 15 : 8) * pulse * (W < 500 ? .8 : 1);
  ctx.save();
  const sg = ctx.createRadialGradient(hp[0],hp[1],0,hp[0],hp[1],R*3.2);
  sg.addColorStop(0, "rgba(255,230,150,.9)"); sg.addColorStop(1, "rgba(255,150,200,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(hp[0],hp[1],R*3.2,0,7); ctx.fill();
  star(hp[0], hp[1], R, tt*.4); ctx.fillStyle = "#fff6c8"; ctx.shadowColor = "#ffd98a"; ctx.shadowBlur = 16; ctx.fill();
  ctx.restore();

  // часы у неё дома
  if (state === "run") {
    let txt, date;
    if (!reached) {
      const mins = Math.max(0, 1440 - (SHOME - fr.s)*60), hh = Math.floor(mins/60), mm = Math.floor(mins%60);
      txt = String(hh).padStart(2,"0") + ":" + String(mm).padStart(2,"0"); date = "15 " + MONTH;
    } else { txt = "00:00"; date = "16 " + MONTH; }
    $("hudClock").textContent = txt; $("hudDate").textContent = date;

    if (reached && !finaleShown) {
      finaleShown = true; burst(hp[0], hp[1], 160); lastBurst = tt;
      linesTimer.push(setTimeout(showFinale, 1800));
    }
    if (reached) {
      if (tt - lastBurst > .55) { lastBurst = tt; burst(Math.random()*W, Math.random()*H_*.7, 50); }
    }
  }

  // частицы
  updateParts(dt);
  ctx.globalCompositeOperation = "lighter";
  for (const p of parts) { ctx.globalAlpha = Math.max(p.life,0); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 2.6, 2.6); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

  requestAnimationFrame(frame);
}

/* ---------- финал ---------- */
function showFinale() {
  const fin = $("finale");
  $("finTitle").textContent = CONFIG.title.replace("{name}", CONFIG.name);
  fin.classList.remove("off"); fin.classList.add("bg");
  $("hud").classList.add("hide");
  const lines = [...document.querySelectorAll("#lines .line")];
  if ($("photos").children.length) linesTimer.push(setTimeout(() => $("photos").classList.add("show"), 1500));
  lines.forEach((l, i) => linesTimer.push(setTimeout(() => l.classList.add("show"), 3000 + i*2600)));
}

/* ---------- сборка текста и фото ---------- */
$("introTitle").textContent = "Для тебя ✨";
$("lines").innerHTML = CONFIG.lines.map(t => `<p class="line">${t}</p>`).join("");

(function loadPhotos() {
  const box = $("photos");
  let idx = 0;
  for (let i = 1; i <= 12; i++) {
    const exts = ["jpg","jpeg","png","webp","JPG","jpeg"];
    const tryExt = k => {
      if (k >= exts.length) return;
      const img = new Image();
      img.onload = () => {
        const fig = document.createElement("figure");
        fig.style.order = i; fig.style.setProperty("--r", ((i%3)-1)*2.2 + "deg");
        fig.appendChild(img); box.appendChild(fig);
      };
      img.onerror = () => tryExt(k+1);
      img.src = `photos/${i}.${exts[k]}`;
    };
    tryExt(0);
  }
})();

// если страницу открыли сильно позже полуночи — просто кнопка, без авто-старта
if (CONFIG.target - Date.now() < -(CONFIG.d1+CONFIG.d2+300)*1000) CONFIG.target = new Date(Date.now() + 1e12);
requestAnimationFrame(frame);
</script>
</body>
</html>
